[project]
name = "arbordocs"
version = "0.1.0"
description = "Captures decisions from Discord chat and reconciles them against a GitHub codebase."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "discord.py>=2.4",
    "sentence-transformers>=5.6.0",
    "pgvector>=0.5.0",
    "groq>=1.5.0",
    "ollama>=0.6.2",
    "markdown>=3.10.3",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pip-audit>=2.10.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Form", "fastapi.params.Form"]
