name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.5.x"
  PYTHON_VERSION: "3.12"

jobs:
  checks:
    name: Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Check formatting (ruff format)
        run: uv run ruff format --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arbordocs
          POSTGRES_PASSWORD: arbordocs
          POSTGRES_DB: arbordocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arbordocs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://arbordocs:arbordocs@localhost:5432/arbordocs
      SESSION_SECRET: ci-test-secret
      GITHUB_APP_ID: "0"
      GITHUB_APP_SLUG: ci-test
      GITHUB_APP_CLIENT_ID: ci-test
      GITHUB_APP_CLIENT_SECRET: ci-test
      GITHUB_APP_PRIVATE_KEY_PATH: ""
      GITHUB_WEBHOOK_SECRET: ci-test
      DISCORD_BOT_TOKEN: ""
      DISCORD_OAUTH_CLIENT_ID: ci-test
      DISCORD_OAUTH_CLIENT_SECRET: ci-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run migrations against a real Postgres+pgvector instance
        run: uv run alembic upgrade head

      - name: Check for schema drift (models vs. latest migration)
        run: |
          uv run alembic check

      - name: Run tests
        run: uv run pytest -v

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Semgrep static analysis
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit
            p/secrets

      - name: pip-audit (dependency vulnerability scan)
        id: audit
        run: uv run pip-audit --strict
        continue-on-error: true

      - name: Report pip-audit findings
        if: steps.audit.outcome == 'failure'
        run: |
          echo "### :warning: pip-audit found vulnerable dependencies" >> "$GITHUB_STEP_SUMMARY"
          echo "Non-blocking for now — tighten once the dependency set stabilizes." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run pip-audit >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
