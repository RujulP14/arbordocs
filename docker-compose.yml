services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arbordocs
      POSTGRES_PASSWORD: arbordocs
      POSTGRES_DB: arbordocs
    ports:
      - "5432:5432"
    volumes:
      - arbordocs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbordocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    ports:
      - "54323:8080"
    depends_on:
      - db

volumes:
  arbordocs_pgdata:
