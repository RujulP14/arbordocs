<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}ArborDocs{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a href="/projects" class="brand">ArborDocs</a>
    {% if user %}
      <span class="user">{{ user.github_login }}</span>
      <form method="post" action="/auth/github/logout">
        <button type="submit">Log out</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
